name: forge
description: "Forge — an offline-first gym tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management.
  flutter_riverpod: ^3.3.2

  # Navigation.
  go_router: ^17.2.3

  # Local offline persistence.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

  # UI & helpers.
  table_calendar: ^3.2.0
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  animations: ^2.2.0

  # Utilities.
  intl: ^0.20.3
  equatable: ^2.1.0
  uuid: ^4.6.0
  crypto: ^3.0.6
  image: ^4.5.4
  # Pinned below 13.x: permission_handler_android 14.x requires AGP 9 /
  # compileSdk 37, which this Flutter toolchain does not yet support.
  permission_handler: ^12.0.3
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Hive code generation. Pinned: build_runner 2.4.13 is the newest version
  # whose analyzer constraint (<7.0.0) is compatible with hive_generator.
  build_runner: 2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
